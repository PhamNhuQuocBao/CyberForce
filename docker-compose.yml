# Local full stack. Existing infrastructure volumes are retained.
include:
  - infra/docker-compose.yml

x-api: &api
  build:
    context: .
    target: api
  environment: &api-env
    NODE_ENV: development
    PORT: 4000
    DATABASE_URL: postgresql://${POSTGRES_USER:-cyberforce}:${POSTGRES_PASSWORD:-cyberforce_local_dev}@postgres:5432/${POSTGRES_DB:-cyberforce}?schema=public
    REDIS_URL: redis://redis:6379
    ORCHESTRATOR_URL: http://orchestrator:8081
    ORCHESTRATOR_TOKEN: ${ORCHESTRATOR_TOKEN:-cyberforce_local_orchestrator_token_2026}
    API_BASE_URL: ${API_BASE_URL:-http://localhost:4000}
    WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
    JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-cyberforce_local_access_secret_at_least_32_characters}
    JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-cyberforce_local_refresh_secret_at_least_32_characters}
    JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
    JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
    PLATFORM_MASTER_KEY: ${PLATFORM_MASTER_KEY:-}
    GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
    GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
    GITHUB_CALLBACK_URL: ${GITHUB_CALLBACK_URL:-http://localhost:4000/api/v1/auth/oauth/github/callback}
    GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-http://localhost:4000/api/v1/auth/oauth/google/callback}
  networks:
    - cyberforce-net

services:
  terminal-image:
    image: alpine:3.21
    command: ['true']
    restart: 'no'
    network_mode: none

  orchestrator:
    build:
      context: ./services/orchestrator
    restart: unless-stopped
    init: true
    environment:
      ORCHESTRATOR_TOKEN: ${ORCHESTRATOR_TOKEN:-cyberforce_local_orchestrator_token_2026}
      REAPER_DATABASE_URL: postgresql://cyberforce_reaper@postgres:5432/${POSTGRES_DB:-cyberforce}
      REAPER_DB_PASSWORD: ${REAPER_DB_PASSWORD:-cyberforce_local_reaper_password_2026}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      terminal-image:
        condition: service_completed_successfully
    networks:
      - cyberforce-net
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:8081/health || exit 1']
      interval: 5s
      timeout: 5s
      retries: 12

  db-init:
    <<: *api
    restart: 'no'
    environment:
      <<: *api-env
      REAPER_DB_PASSWORD: ${REAPER_DB_PASSWORD:-cyberforce_local_reaper_password_2026}
    command:
      - sh
      - -c
      - pnpm exec prisma db push --skip-generate && node dist/scripts/setup-reaper-role.js
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *api
    restart: unless-stopped
    init: true
    ports:
      - '${API_PORT:-4000}:4000'
    depends_on:
      db-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      orchestrator:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 12

  web:
    build:
      context: .
      target: web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/api/v1}
    restart: unless-stopped
    init: true
    ports:
      - '${WEB_PORT:-3000}:3000'
    depends_on:
      api:
        condition: service_healthy
    networks:
      - cyberforce-net
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 12
